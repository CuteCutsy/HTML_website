<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Объектная модель документа</title>
    <style>
        /* ===== РАДУЖНЫЙ ЗАГОЛОВОК ===== */
        h1 {
            font-size: 3em;
            text-align: center;
            background: linear-gradient(
                90deg,
                #ff0000, #ff7f00, #ffff00, #00ff00,
                #0000ff, #4b0082, #9400d3, #ff0000
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 5s linear infinite;
        }

        /* ===== РАДУЖНЫЕ ССЫЛКИ ===== */
        ul li a {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                #ff0000, #ff7f00, #ffff00, #00ff00,
                #0000ff, #4b0082, #9400d3, #ff0000
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;

            transition: transform 0.2s ease, background-color 0.2s ease;
        }
       /* ЭФФЕКТ ПРИ НАВЕДЕНИИ МЫШКИ НА ССЫЛКИ */
       ul li a:hover { transform: scale(1.15); animation: rainbow 2s linear infinite; }
       ul li a.active { animation: rainbow 3s linear infinite; }

        /* ===== АНИМАЦИЯ ПЕРЕЛИВАНИЯ ===== */
        @keyframes rainbow {
            0%   { background-position:   0% center; }
            100% { background-position: 200% center; }
        }

        /* ===== РАДУЖНЫЕ ТОЧКИ ===== */
        ul li:nth-child(7n+1)::marker { color: #ff0000; }
        ul li:nth-child(7n+2)::marker { color: #ff7f00; }
        ul li:nth-child(7n+3)::marker { color: #ffff00; }
        ul li:nth-child(7n+4)::marker { color: #00ff00; }
        ul li:nth-child(7n+5)::marker { color: #0000ff; }
        ul li:nth-child(7n+6)::marker { color: #4b0082; }
        ul li:nth-child(7n+7)::marker { color: #9400d3; }

        /* ===== СТИЛИ ДЛЯ СКРИНШОТА ===== */
        .screenshot-container {
            text-align: center;
            margin: 40px 0;
        }
        
        .screenshot-container img {
            max-width: 90%;
            border: 4px solid #bde4ff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .screenshot-container img:hover {
            transform: scale(1.02); /* ЭФФЕКТ */
        }
    </style>
</head>
