<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Увеличенное изображение</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f9;
    }
    img {
      width: 1200px; 
      border: 4px solid #bde4ff;
      border-radius: 10px;
      object-fit: cover;
    }
    p {
      font-size: 1.5em;
      font-weight: bold;
      color: #bde4ff;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <img src="https://i.pinimg.com/1200x/5e/e1/43/5ee1430347c51ae72b7f7bbad3ffc2b9.jpg" alt="Большой котик">
  
  <p>Котик с шапочкой из фольги</p>

</body>
</html>
