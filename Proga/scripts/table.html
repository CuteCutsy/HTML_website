<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица</title>
    <style>
        /* ===== РАДУЖНЫЙ ЗАГОЛОВОК ===== */
        h1 {
            font-size: 3em; text-align: center;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
            color: transparent; animation: rainbow 5s linear infinite;
        }

        /* ===== РАДУЖНЫЕ ССЫЛКИ ===== */
        ul li a {
            display: inline-block; padding: 2px 6px; border-radius: 4px; text-decoration: none; font-weight: bold;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
            color: transparent; -webkit-text-fill-color: transparent; transition: transform 0.2s ease;
        }
        
        /* ЭФФЕКТ ПРИ НАВЕДЕНИИ МЫШКИ НА ССЫЛКИ */
        ul li a:hover { transform: scale(1.15); animation: rainbow 2s linear infinite; }
        ul li a.active { animation: rainbow 3s linear infinite; }

        /* ===== АНИМАЦИЯ И ВЫДЕЛЕНИЕ ===== */
        @keyframes rainbow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        ::selection { background: linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#9400d3); color: #fff; }

        /* ===== ЗАДНИЙ ПЛАН ВСЕЙ СТРАНИЦЫ ===== */
        body {
            background-image: url('https://i.pinimg.com/736x/e5/f1/f4/e5f1f4c68a5f37821c4aaf581ce85c11.jpg');
            background-size: cover; background-attachment: fixed; background-position: center;
            margin: 0; padding: 20px;
        }

        ::selection {
      background: linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#0000ff,#4b0082,#9400d3); /* ФОН ВЫДЕЛЕНИЯ СТАНОВИТСЯ РАДУЖНЫМ */
      color: #bde4ff; /* А ЦВЕТ САМИХ БУКВ - ГОЛУБЫМ */
        }

        /* ===== РАДУЖНЫЕ ТОЧКИ ===== */
        ul li:nth-child(7n+1)::marker { color: #ff0000; }
        ul li:nth-child(7n+2)::marker { color: #ff7f00; }
        ul li:nth-child(7n+3)::marker { color: #ffff00; }
        ul li:nth-child(7n+4)::marker { color: #00ff00; }
        ul li:nth-child(7n+5)::marker { color: #0000ff; }
        ul li:nth-child(7n+6)::marker { color: #4b0082; }
        ul li:nth-child(7n+7)::marker { color: #9400d3; }
    </style>
</head>
