        /* ===== АНИМАЦИЯ ПЕРЕЛИВАНИЯ ===== */
        @keyframes rainbow {
            0%   { background-position:   0% center; }

    <form action="https://httpbin.org/post" method="post" target="_blank" id="UserEnter">
        
        <textarea name="formulation" rows="3">Можно ли из бревна, имеющего диаметр поперечного сечения D, выпилить квадратный брус шириной A? Если можно - отправить все на сервер</textarea>

        <div class="input-group">
            <label>Диаметр бревна D: <input id="D" name="D" type="number" step="any" value="200" required></label>
        </div>
        
        <div class="input-group">
            <label>Ширина бруса A: <input id="A" name="A" type="number" step="any" value="130" required></label>
        </div>

        <div class="result-box">
            <label>Результат: <input id="result" name="result" value="не определен" readonly></label>
        </div>

        <div class="btn-group">
            <!-- КНОПКА ПРОВЕРКИ -->
            <input id="verify" type="button" value="Проверить" onclick="checkTask()">
            <!-- КНОПКА ОТПРАВИТЬ -->
            <input id="submit-btn" type="submit" value="Отправить на сервер">
        </div>
    </form>
</div>

<script>
    function checkTask() {
        // ЗНАЧЕНИЕ ИЗ ПОЛЕЙ
        let D = parseFloat(document.getElementById('D').value);
        let A = parseFloat(document.getElementById('A').value);
        let resultField = document.getElementById('result');

        // ПРОВЕРКА КОРЕКТНОСТИ ВВОДА
        if (isNaN(D) || isNaN(A) || D <= 0 || A <= 0) {
            resultField.value = "Ошибка ввода! Введите положительные числа.";
            resultField.style.color = "red";
            return;
        }

        // ФОРМУЛА: A * Math.sqrt(2) <= D
        let diagonal = A * Math.sqrt(2);

        if (diagonal <= D) {
            resultField.value = "Да, можно";
            resultField.style.color = "green";
        } else {
            resultField.value = "Нет, нельзя";
            resultField.style.color = "red";
        }
    }
</script>
